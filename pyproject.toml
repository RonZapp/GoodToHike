[project]
name = "goodtohike"
version = "0.1.0"
description = "An API for building reports about trail conditions."
readme = "README.md"
authors = [
    { name = "Ron", email = "ronzappardino@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "gpxpy>=1.6.2",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
extraPaths = ["src"]
